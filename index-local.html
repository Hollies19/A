
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Editor.md 本地引入示例</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 本地样式（确保存在 editor.md/css/editormd.min.css） -->
  <link rel="stylesheet" href="editor.md/css/editormd.min.css" />
  <style>body{max-width:1200px;margin:20px auto;padding:0 16px;}</style>
</head>
<body>
  <h1>Editor.md 本地引入示例</h1>
  <p>如果你能看到一个带工具栏的编辑器，说明已成功加载。</p>

  <div id="editor">
    <!-- Editor.md 会自动插入一个 <textarea>，也可以保留下面这段初始文案 -->
    <textarea style="display:none;"># Hello Editor.md!
这是一个 **Markdown** 编辑器示例。

- 支持表格/公式/流程图（需额外库）
- 左侧输入，右侧预览
- 更多配置请参考官方文档

```js
console.log("Welcome to Editor.md");
```
    </textarea>
  </div>

  <!-- 先引入 jQuery（本地） -->
  <script src="jquery.min.js"></script>
  <!-- 再引入 Editor.md 主脚本（本地） -->
  <script src="editor.md/editormd.min.js"></script>
  <script>
    $(function () {
      var editor = editormd("editor", {
        width: "100%",
        height: 640,
        // 关键：依赖库自动加载的根路径，需指向 editor.md/lib/
        path: "editor.md/lib/"
      });
    });
  </script>
</body>
</html>
