
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Markdown → HTML 预览（CDN）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/editor.md/css/editormd.preview.css" />
  <style>body{max-width:900px;margin:20px auto;padding:0 16px;}</style>
</head>
<body>
  <h1>Markdown → HTML 预览（CDN）</h1>
  <div id="md-preview">
    <textarea style="display:none;">### Hello world (CDN)!
- 这是一个仅用于展示 Markdown 渲染效果的页面
- 无编辑功能
    </textarea>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/editor.md/editormd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/editor.md/lib/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/editor.md/lib/prettify.min.js"></script>
  <script>
    $(function () {
      editormd.markdownToHTML("md-preview", {
        // markdown: "[TOC]\n### Hello world!"
        // htmlDecode: "style,script,iframe"
      });
    });
  </script>
</body>
</html>
